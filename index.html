<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SchleiWetter</title>

    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>


<body>

    <main>

        <section>

            <div class="search">
                <input type="text" id="citySearch" placeholder="Suchen...">
                <button onclick="searchCity(document.getElementById('citySearch').value)">Suchen</button>
            </div>

            <h1 id="cityName">Schleswig</h1>
            <div class="location">
                <p id="country">Deutschland</p>
                <p>•</p>
                <time id="time">01.01.2026, 00:00</time>
            </div>

            <div class="conditions">
                <p id="weatherIcon">?</p>
                <p id="temp">0.0°C</p>
                <p id="weather">Lädt...</p>
            </div>
            <div class="otherConditions">
                <p id="precipitationChance">🌧️ 0%</p>
                <p id="windSpeed">💨 0km/h</p>
            </div>

        </section>

        <section></section>

    </main>

</body>


</html>
